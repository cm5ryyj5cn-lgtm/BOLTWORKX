iness model and reviewed before sale.</div><h3>BoltWorkx terms of use</h3><p><strong>Provider:</strong> ${business}, ${address}. Contact: ${contact}.</p><p><strong>Licence:</strong> subject to payment and these terms, the provider grants the customer a limited, non-exclusive licence to use BoltWorkx for their own business. The customer must not resell, redistribute, reverse engineer or claim ownership of the app unless a separate written agreement says otherwise.</p><p><strong>Local data and backups:</strong> the customer is responsible for their records, device security, exports and backups. The provider is not responsible for data lost through browser clearing, device failure, theft or an invalid backup.</p><p><strong>Financial estimates:</strong> tax, income, expense and financial figures are estimates only and are not accounting, tax, legal or financial advice.</p><p><strong>Availability:</strong> the standalone app is provided without a promise of cloud availability, support or uninterrupted operation unless separately agreed.</p><p><strong>Liability and consumer rights:</strong> nothing in these terms limits rights or remedies that cannot legally be excluded. If you sell digital content to consumers online, provide the required pre-contract information, cancellation information and confirmation, including any valid consent for immediate download.</p><p><strong>Governing law:</strong> [INSERT YOUR JURISDICTION AND COURTS].</p></div>`); else openModal('Legal checklist',`<div class="detail"><div class="notice">Before selling or publishing, complete these items for your actual business and product.</div><ul><li>Legal business or sole-trader name, trading address and contact email</li><li>Privacy notice covering personal data, lawful bases, recipients, retention and rights</li><li>Decide whether you are controller or processor for each customer-data use</li><li>Check whether you need ICO registration or a data-protection fee</li><li>Secure device access and exported backups; define a retention and deletion process</li><li>Terms, licence, price, VAT treatment, support, updates and refund policy</li><li>For online digital sales: cancellation rights, immediate-download consent and savable contract confirmation</li><li>Cookie/storage notice if you add analytics, advertising, accounts or cloud services</li><li>Accessibility, security and breach-response process</li><li>Professional legal and tax review before commercial release</li></ul></div>`); }
      function ensureBackupStatus() { if(state.section!=='Settings'||document.getElementById('backup-status'))return; const callout=document.querySelector('.data-callout'); if(!callout)return; const last=state.data.settings.lastBackupAt?dateText(String(state.data.settings.lastBackupAt).slice(0,10)):'Not created yet'; callout.insertAdjacentHTML('beforeend',`<small id="backup-status">Last backup: ${esc(last)}</small>`); }
      function ensureAutoBackupControls() {
        if(state.section!=='Settings'||document.getElementById('auto-backup-interval'))return;
        const panel=document.querySelector('.data-panel:not(.legal-panel)');
        const actions=panel&&panel.querySelector('.export-actions');
        if(!actions)return;
        const hasBackup=!!state.data.settings.lastBackupAt;
        const minutes=Number(state.data.settings.autoBackupMinutes)||0;
        const fileAccess=typeof window.showSaveFilePicker==='function';
        const canSchedule=fileAccess?backupFilePermission==='granted':hasBackup;
        const lastAutoBackup=state.data.settings.lastAutoBackupAt?` Last automatic save: ${esc(new Date(state.data.settings.lastAutoBackupAt).toLocaleString('en-GB'))}.`:'';
        const fileStatus=fileAccess?(backupFileHandle?`Selected file: ${esc(backupFileHandle.name)}${backupFilePermission==='granted'?'':' · Permission needed; reconnect to continue.'}${lastAutoBackup}`:'Choose a backup file to overwrite automatically.'):'This browser cannot overwrite files automatically. Automatic backups will download separate files.';
        actions.insertAdjacentHTML('afterend',`<div class="auto-backup"><div class="export-actions">${fileAccess?button(backupFileHandle?'Reconnect or change backup file':'Choose backup file','choose-backup-file','secondary'):''}</div><p class="muted">${fileStatus}</p><label class="field"><span>Automatic backups</span><select id="auto-backup-interval"${canSchedule?'':' disabled'}><option value="0"${minutes===0?' selected':''}>Off</option><option value="1"${minutes===1?' selected':''}>Every minute</option><option value="5"${minutes===5?' selected':''}>Every 5 minutes</option><option value="10"${minutes===10?' selected':''}>Every 10 minutes</option><option value="15"${minutes===15?' selected':''}>Every 15 minutes</option><option value="30"${minutes===30?' selected':''}>Every 30 minutes</option><option value="60"${minutes===60?' selected':''}>Every hour</option><option value="240"${minutes===240?' selected':''}>Every 4 hours</option></select><small>${canSchedule?'Updates the selected backup file in place while BoltWorkx stays open. Use “Save backup” to choose or update that same file.':'Select a backup destination first to enable automatic backups.'} Browsers without file access download separate files.</small></label></div>`);
      }
      function createBackupFile(backupTime,automatic=false) { const payload={...state.data,backupCreatedAt:backupTime,backupVersion:1}; const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})); const link=document.createElement('a');link.href=url;link.download=`boltworkx-backup-${automatic?backupTime.replace(/[:.]/g,'-'):currentMonth()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
      function backupHandleDatabase() {
        return new Promise((resolve,reject)=>{
          const request=indexedDB.open('boltworkx-backup-handles',1);
          request.onupgradeneeded=()=>request.result.createObjectStore('files');
          request.onsuccess=()=>resolve(request.result);
          request.onerror=()=>reject(request.error||new Error('Could not open backup file storage.'));
        });
      }
      async function storeBackupFileHandle(handle) {
        const database=await backupHandleDatabase();
        await new Promise((resolve,reject)=>{
          const transaction=database.transaction('files','readwrite');
          transaction.objectStore('files').put(handle,'automatic-backup');
          transaction.oncomplete=resolve;
          transaction.onerror=()=>reject(transaction.error||new Error('Could not save the selected backup file.'));
          transaction.onabort=()=>reject(transaction.error||new Error('Saving the selected backup file was cancelled.'));
        });
        database.close();
      }
      async function loadBackupFileHandle() {
        const database=await backupHandleDatabase();
        const handle=await new Promise((resolve,reject)=>{
          const request=database.transaction('files','readonly').objectStore('files').get('automatic-backup');
          request.onsuccess=()=>resolve(request.result||null);
          request.onerror=()=>reject(request.error||new Error('Could not load the saved backup file.'));
        });
        database.close();
        return handle;
      }
      async function writeAutomaticBackup(handle,automatic=true) {
        const backupTime=stamp();
        const settings={...state.data.settings,lastBackupAt:backupTime,...(automatic?{lastAutoBackupAt:backupTime}:{})};
        const payload={...state.data,settings,backupCreatedAt:backupTime,backupVersion:1};
        const writable=await handle.createWritable();
        await writable.write(JSON.stringify(payload,null,2));
        await writable.close();
        state.data.settings=settings;
        persist();
        return backupTime;
      }
      async function requestBackupFilePermission(handle) {
        let permission=await handle.queryPermission({mode:'readwrite'});
        if(permission!=='granted'&&typeof handle.requestPermission==='function')permission=await handle.requestPermission({mode:'readwrite'});
        return permission;
      }
      async function chooseBackupFile() {
        try {
          let handle=backupFileHandle;
          const suggestedName=backupFileHandle?.name||'boltworkx-backup.json';
          if(handle&&backupFilePermission!=='granted') {
            backupFilePermission=await requestBackupFilePermission(handle);
            if(backupFilePermission!=='granted')handle=null;
          } else {
            handle=null;
          }
          if(!handle) {
            if(!window.showSaveFilePicker){notify('This browser cannot overwrite a selected backup file.');return;}
            handle=await window.showSaveFilePicker({suggestedName,types:[{description:'BoltWorkx backup',accept:{'application/json':['.json']}}]});
            backupFilePermission=await requestBackupFilePermission(handle);
          }
          if(backupFilePermission!=='granted'){notify('Allow file access to enable automatic backups.');return;}
          const backupTime=await writeAutomaticBackup(handle,false);
          await storeBackupFileHandle(handle);
          backupFileHandle=handle;
          render();
          scheduleAutoBackup();
          notify(`Backup saved to ${handle.name}`);
          return backupTime;
        } catch(error) {
          if(error&&error.name==='AbortError')return;
          notify(`Could not save the automatic backup: ${error.message||'Unknown file error'}`);
        }
      }
      async function autoBackup() {
        if(!(Number(state.data.settings.autoBackupMinutes)>0)||autoBackupInProgress)return;
        autoBackupInProgress=true;
        try {
          if(window.showSaveFilePicker) {
            if(!backupFileHandle||backupFilePermission!=='granted')throw new Error('Reconnect the selected backup file in Settings.');
            await writeAutomaticBackup(backupFileHandle,true);
            notify(`Automatic backup updated: ${backupFileHandle.name}`);
          } else {
            if(!state.data.settings.lastBackupAt)return;
            const backupTime=stamp();
            state.data.settings.lastAutoBackupAt=backupTime;
            persist();
            createBackupFile(backupTime,true);
            notify('Automatic backup downloaded');
          }
        } catch(error) {
          if(backupFileHandle)backupFilePermission=await backupFileHandle.queryPermission({mode:'readwrite'}).catch(()=> 'prompt');
          if(state.section==='Settings')render();
          notify(`Automatic backup stopped: ${error.message||'Could not update the backup file.'}`);
          scheduleAutoBackup();
        } finally {
          autoBackupInProgress=false;
        }
      }
      function scheduleAutoBackup() {
        if(autoBackupTimer)clearInterval(autoBackupTimer);
        autoBackupTimer=null;
        const minutes=Number(state.data.settings.autoBackupMinutes)||0;
        if(minutes<=0)return;
        if(window.showSaveFilePicker) {
          if(backupFileHandle&&backupFilePermission==='granted')autoBackupTimer=setInterval(autoBackup,minutes*60*1000);
        } else if(state.data.settings.lastBackupAt)autoBackupTimer=setInterval(autoBackup,minutes*60*1000);
      }
      async function restoreBackupFileHandle() {
        if(!window.showSaveFilePicker)return;
        try {
          const handle=await loadBackupFileHandle();
          if(!handle)return;
          backupFileHandle=handle;
          backupFilePermission=await handle.queryPermission({mode:'readwrite'});
          scheduleAutoBackup();
          if(state.section==='Settings')render();
        } catch(error) {
          notify(`Could not reconnect the automatic backup file: ${error.message||'Unknown file error'}`);
        }
      }

        const invoice=`<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoice ${esc(job.reference)}</title><style>body{margin:0;padding:40px;color:#182722;font:14px Arial,sans-serif}main{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;gap:24px;margin-bottom:48px}h1{margin:0 0 8px;font-size:30px;font-weight:400}h2{margin:0 0 8px;font-size:16px}p{margin:4px 0;color:#52645a;white-space:pre-line}table{width:100%;border-collapse:collapse;margin-top:32px}th{padding:10px 8px;border-bottom:2px solid #182722;text-align:left;font-size:11px;text-transform:uppercase}td{padding:12px 8px;border-bottom:1px solid #dfe7e0}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.totals{width:280px;margin:24px 0 0 auto}.totals div{display:flex;justify-content:space-between;padding:6px 0}.totals .grand{margin-top:6px;padding-top:12px;border-top:2px solid #182722;font-size:17px;font-weight:700}@media print{body{padding:0}button{display:none}}</style></head><body><main><header><div><h1>Invoice</h1><p>${esc(business)}</p></div><div><h2>${invoiceJobs.map((item)=>esc(item.reference)).join(' / ')}</h2><p>Invoice date: ${esc(dateText(new Date().toISOString().slice(0,10)))}</p><p>${invoiceJobs.length} job${invoiceJobs.length===1?'':'s'} in this ${job.recurrence&&job.recurrence.frequency!=='none'?'repeat series':'invoice'}</p></div></header><section><h2>Bill to</h2><p>${esc(job.customerName)}</p><p>${esc(customerAddress||'Address not provided')}</p>${customer&&customer.email?`<p>${esc(customer.email)}</p>`:''}</section><table><thead><tr><th>Job and date</th><th>Description</th><th>Quantity</th><th>Unit price</th><th>VAT</th><th>Amount</th></tr></thead><tbody>${lineRows||'<tr><td colspan="6">No line items</td></tr>'}</tbody></table><div class="totals"><div><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div><span>VAT</span><strong>${money(vatTotal)}</strong></div><div class="grand"><span>Total due</span><strong>${money(grandTotal)}</strong></div></div><button onclick="window.print()">Print invoice</button></main></body></html>`;
        const invoiceWindow=window.open('',`boltworkx-invoice-${job.id}`); if(!invoiceWindow){notify('Allow pop-ups to create the invoice.');return;} invoiceWindow.document.write(invoice); invoiceWindow.document.close(); invoiceWindow.focus(); setTimeout(()=>invoiceWindow.print(),250);

      document.addEventListener('pointerdown',(event)=>{if(!(event.target instanceof Element))return;const day=event.target.closest('[data-rota-date]');if(!day||!document.getElementById('rota-form')||event.button!==0)return;event.preventDefault();state.rotaDragAnchor=day.dataset.rotaDate;state.rotaDragActive=true;state.rotaSuppressClick=false;updateRotaDateSelection([state.rotaDragAnchor]);});

      document.addEventListener('input',(event)=>{
        if(event.target.id==='search'){state.query=event.target.value;updateCollection();}
        if(event.target.matches('[data-line-field]')){const line=state.formLines.find((item)=>item.id===event.target.dataset.id);if(line){const key=event.target.dataset.lineField;line[key]=key==='description'||key==='unit'?event.target.value:Number(event.target.value);const card=event.target.closest('.line-editor');const total=card ? card.querySelector('.line-total') : undefined;if(total)total.innerHTML=`<span>${esc(line.quantity)} × ${money(line.unitPrice)}</span><strong>${money(round(Number(line.quantity)*Number(line.unitPrice)))}</strong>`;renderTotals();}}
      });
      document.addEventListener('change',(event)=>{
        if(event.target.id==='expense-receipt'){const file=event.target.files&&event.target.files[0];const preview=document.getElementById('expense-receipt-preview');state.receiptImage='';state.receiptName='';state.receiptProcessing=false;if(!file){if(preview){preview.hidden=true;preview.removeAttribute('src');}return;}if(!file.type.startsWith('image/')){notify('Choose an image file for the receipt.');event.target.value='';return;}state.receiptProcessing=true;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const maxSize=1200;const scale=Math.min(1,maxSize/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);state.receiptImage=canvas.toDataURL('image/jpeg',.78);state.receiptName=file.name;state.receiptProcessing=false;if(preview){preview.src=state.receiptImage;preview.hidden=false;}};image.onerror=()=>{state.receiptProcessing=false;notify('That receipt image could not be read.');};image.src=String(reader.result||'');};reader.onerror=()=>{state.receiptProcessing=false;notify('That receipt image could not be read.');};reader.readAsDataURL(file);return;}
        if(event.target.id==='auto-backup-interval'){const minutes=Math.max(0,Number(event.target.value)||0);setData({...state.data,settings:{...state.data.settings,autoBackupMinutes:minutes}},minutes?'Automatic backups enabled':'Automatic backups disabled');scheduleAutoBackup();return;}
        if(event.target.id==='route-date'){showRoutePlanner(event.target.value);return;}
        if(event.target.name==='miles'||event.target.name==='ratePerMile'){const form=event.target.closest('#expense-form');if(form){const miles=Number(form.querySelector('[name="miles"]')?.value);const rate=Number(form.querySelector('[name="ratePerMile"]')?.value);const amount=form.querySelector('[name="amount"]');if(amount&&Number.isFinite(miles)&&miles>0&&Number.isFinite(rate)&&rate>0)amount.value=round(miles*rate).toFixed(2);}}

      });
